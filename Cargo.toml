[package]
name = "toy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rust_decimal = "1.23"
thiserror = "1.0"
tokio = { version = "1.18", features = ["sync", "rt", "macros", "rt-multi-thread"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
